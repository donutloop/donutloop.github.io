# AAA-31: nightly seeded marathon with flake-tracking.
# Runs the full test pipeline across several base seeds; any flaky stage
# (passes on one seed, fails on another) fails the job.
name: nightly-marathon

on:
  schedule:
    - cron: '0 3 * * *'   # nightly at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  marathon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Nightly seeded marathon (5 seeds, flake-tracking)
        run: npm run test:nightly
